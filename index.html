<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Quality</title>
    <link rel="stylesheet" href="style.css?v=330">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Écran d'entrée -->
    <div id="enter-screen" class="glass-panel">
        <h1 class="enter-title neon-name pseudo-font" id="enter-title-name">𝐞𝐱</h1>
        <p class="pulse-text">Cliquez pour entrer</p>
    </div>

    <!-- Vidéo de fond -->
    <div class="video-container">
        <video id="bg-video" loop playsinline>
            <source src="background.mp4?v=250" type="video/mp4">
            Votre navigateur ne supporte pas la balise vidéo.
        </video>
    </div>

    <!-- Contrôles en bas à gauche (Compteur de visites) -->
    <div class="bottom-left-controls">
        <div id="views-counter-badge" class="views-badge-corner glass-panel" title="Nombre total de visites">
            <svg class="views-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <span id="views-count-text" class="views-text">1,488</span>
            <span class="views-label">visites</span>
        </div>
    </div>

    <!-- Contrôles en bas à droite -->
    <div class="bottom-right-controls">
        <div id="location-corner" class="location-badge-corner glass-panel">
            <svg class="location-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
            </svg>
            <span class="location-text">Dubaï</span>
        </div>

        <div id="volume-control" class="hidden glass-panel">
            <label for="volume-slider">🔊</label>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
    </div>

    <!-- Notification Copie -->
    <div id="copy-toast" class="copy-toast">✨ Pseudo @vq copié !</div>

    <!-- Contenu principal -->
    <div id="main-content" class="hidden">
        <div class="content-wrapper">
            <!-- Avatar avec couronne royale animée -->
            <div class="avatar-crown-wrapper">
                <div class="crown-icon-animated">
                    <svg viewBox="0 0 64 48" class="crown-svg" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#fffbeb"/>
                                <stop offset="25%" stop-color="#fde047"/>
                                <stop offset="60%" stop-color="#eab308"/>
                                <stop offset="100%" stop-color="#a16207"/>
                            </linearGradient>
                            <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#ffffff"/>
                                <stop offset="50%" stop-color="#fef08a"/>
                                <stop offset="100%" stop-color="#ca8a04"/>
                            </linearGradient>
                            <radialGradient id="rubyGrad" cx="35%" cy="35%" r="65%">
                                <stop offset="0%" stop-color="#ffedd5"/>
                                <stop offset="40%" stop-color="#f43f5e"/>
                                <stop offset="100%" stop-color="#881337"/>
                            </radialGradient>
                            <radialGradient id="diamondGrad" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" stop-color="#ffffff"/>
                                <stop offset="60%" stop-color="#e0f2fe"/>
                                <stop offset="100%" stop-color="#38bdf8"/>
                            </radialGradient>
                            <filter id="royalGlow" x="-30%" y="-30%" width="160%" height="160%">
                                <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
                                <feColorMatrix in="blur" type="matrix" values="
                                    1 0 0 0 0.99
                                    0 0.88 0 0 0.88
                                    0 0 0.28 0 0.28
                                    0 0 0 1 0" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        <g filter="url(#royalGlow)">
                            <path d="M14 36 C18 24, 26 18, 32 18 C38 18, 46 24, 50 36 Z" fill="rgba(161, 98, 7, 0.35)" stroke="url(#goldGrad1)" stroke-width="0.8"/>
                            <path d="M8 37 Q32 43 56 37 L57 42 Q32 48 7 42 Z" fill="url(#goldGrad1)" stroke="#ca8a04" stroke-width="0.5"/>
                            <path d="M10 38.5 Q32 44 54 38.5" stroke="url(#goldLight)" stroke-width="1" fill="none"/>
                            <path d="M26 38 L32 8 L38 38 Z" fill="url(#goldGrad1)"/>
                            <path d="M32 8 L32 39" stroke="url(#goldLight)" stroke-width="1.2"/>
                            <path d="M16 37 L20 18 L27 37 Z" fill="url(#goldGrad1)"/>
                            <path d="M20 18 L22 37" stroke="url(#goldLight)" stroke-width="1"/>
                            <path d="M37 37 L44 18 L48 37 Z" fill="url(#goldGrad1)"/>
                            <path d="M44 18 L42 37" stroke="url(#goldLight)" stroke-width="1"/>
                            <path d="M8 37 L9 24 L17 37 Z" fill="url(#goldGrad1)"/>
                            <path d="M9 24 L12 37" stroke="url(#goldLight)" stroke-width="0.8"/>
                            <path d="M47 37 L55 24 L56 37 Z" fill="url(#goldGrad1)"/>
                            <path d="M55 24 L52 37" stroke="url(#goldLight)" stroke-width="0.8"/>
                            <path d="M32 3 L35 7 L32 11 L29 7 Z" fill="url(#diamondGrad)" stroke="#ffffff" stroke-width="0.6"/>
                            <circle cx="32" cy="7" r="1" fill="#ffffff"/>
                            <circle cx="20" cy="18" r="2.2" fill="url(#rubyGrad)" stroke="#fde047" stroke-width="0.6"/>
                            <circle cx="44" cy="18" r="2.2" fill="url(#rubyGrad)" stroke="#fde047" stroke-width="0.6"/>
                            <circle cx="9" cy="24" r="1.8" fill="url(#diamondGrad)" stroke="#fde047" stroke-width="0.5"/>
                            <circle cx="55" cy="24" r="1.8" fill="url(#diamondGrad)" stroke="#fde047" stroke-width="0.5"/>
                            <circle cx="16" cy="41" r="1.6" fill="url(#diamondGrad)"/>
                            <circle cx="24" cy="42.5" r="1.8" fill="url(#rubyGrad)"/>
                            <circle cx="32" cy="43.5" r="2.2" fill="url(#diamondGrad)" stroke="#ffffff" stroke-width="0.5"/>
                            <circle cx="40" cy="42.5" r="1.8" fill="url(#rubyGrad)"/>
                            <circle cx="48" cy="41" r="1.6" fill="url(#diamondGrad)"/>
                        </g>
                    </svg>
                </div>
                <img src="profile.jpg?v=2" alt="Avatar" class="avatar" id="profile-avatar-top">
            </div>
            <h2 class="neon-name pseudo-font" id="profile-name-top">𝐞𝐱</h2>
            <p class="bio luxury-bio">𝖎𝖓𝖉𝖊𝖙𝖗𝖔𝖓𝖆𝖇𝖑𝖊</p>
            
            <div class="links">
                <!-- CARTE 1 : C.E.O Quality (Jaune Or) - Cliquer pour copier -->
                <div class="featured-card card-yellow copy-user-card" id="ceo-profile-card" title="Cliquer pour copier le pseudo @vq">
                    <div class="card-tag">
                        <span class="card-tag__dot dot-yellow"></span>
                        <span class="card-tag__text">C.E.O QUALITY</span>
                    </div>
                    <div class="card-body">
                        <div class="avatar-container">
                            <img src="profile.jpg?v=2" alt="Avatar" class="presence-avatar" id="card-avatar">
                            <span id="presence-dot" class="status-indicator online" title="En ligne"></span>
                        </div>
                        <div class="card-info">
                            <div class="name-row">
                                <span class="card-username pseudo-font" id="card-username">𝐞𝐱</span>
                                <span class="card-handle">@vq</span>
                                <span class="badge-tag badge-yellow">👑 C.E.O</span>
                            </div>
                            <span id="presence-status-text" class="status-subhead is-online">En ligne sur Quality</span>
                        </div>
                    </div>
                </div>

                <!-- CARTE 2 : Notre application Quality 1.0.1 (Transparent / Glass) -->
                <a href="Quality_setup.exe" class="featured-card card-transparent" style="text-decoration:none;color:inherit;">
                    <div class="card-tag">
                        <span class="card-tag__dot dot-white"></span>
                        <span class="card-tag__text">NOTRE APPLICATION</span>
                    </div>
                    <div class="card-body">
                        <div class="avatar-container">
                            <img src="logo_ocean.jpg?v=3" alt="Quality Logo" class="presence-avatar">
                            <span class="status-indicator online"></span>
                        </div>
                        <div class="card-info">
                            <div class="name-row">
                                <span class="card-username">Quality 1.0.1</span>
                                <span class="badge-tag badge-glass">⚡ App</span>
                            </div>
                            <span class="status-subhead">L'expérience Discord réinventée</span>
                            <span class="click-to-install">click to install</span>
                        </div>
                    </div>
                </a>

                <!-- CARTE 3 : PayPal (Transparent / Glass) -->
                <a href="https://paypal.me/steamapp" target="_blank" class="featured-card card-transparent" style="text-decoration:none;color:inherit;">
                    <div class="card-tag">
                        <span class="card-tag__dot dot-white"></span>
                        <span class="card-tag__text">PAYPAL</span>
                    </div>
                    <div class="card-body">
                        <div class="avatar-container">
                            <img src="paypal_custom.png?v=1" alt="PayPal Logo" class="presence-avatar">
                        </div>
                        <div class="card-info">
                            <div class="name-row">
                                <span class="card-username">Faire un don</span>
                                <span class="badge-tag badge-glass">💙 Support</span>
                            </div>
                            <span class="status-subhead">paypal.me/steamapp</span>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <script src="script.js?v=330"></script>
</body>
</html>
